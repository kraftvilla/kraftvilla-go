<title>КрафтВилла — связаться</title>
<style>
:root{--g:#044443;--t:#c59d75;--c:#f4eee6;--ink:#1e1e1e}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--g);color:var(--c);font-family:Arial,Helvetica,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:440px;padding:32px 20px 40px;display:flex;flex-direction:column;align-items:center}
.logo{background:var(--c);border-radius:16px;padding:18px 22px;width:100%;display:flex;justify-content:center}
.logo img{width:100%;max-width:260px;display:block}
h1{font-family:Georgia,serif;font-size:26px;line-height:1.2;text-align:center;margin:28px 0 6px;font-weight:700}
p.sub{text-align:center;color:var(--t);margin:0 0 26px;font-size:16px}
a.btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:18px 22px;margin-bottom:12px;border-radius:14px;background:var(--c);color:var(--g);text-decoration:none;font-size:19px;font-weight:700}
a.btn small{display:block;font-size:13px;font-weight:400;color:#555;margin-top:2px}
a.btn span.ar{color:var(--t);font-size:24px}
a.btn.main{background:var(--t);color:var(--g)}a.btn.main span.ar{color:var(--g)}
a.btn.main small{color:#3a2a18}
a.tel{margin-top:14px;color:var(--c);text-decoration:none;font-family:Georgia,serif;font-size:22px}
.note{margin-top:6px;color:var(--t);font-size:13px}
